<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CM Worker — weryfikacja struktury</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg:#f4f5f7; --panel:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb;
      --new:#16a34a; --new-bg:#dcfce7; --exist:#64748b; --exist-bg:#eef2f6;
      --accent:#4f46e5; --accent-bg:#eef2ff; --danger:#dc2626;
    }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg); color:var(--ink); }
    /* Sticky: przy 45 adach i 100+ tagach strona jest długa, a „Zatwierdź strukturę”
       i wskaźnik pracy muszą być widoczne bez skrolowania na górę. */
    header { position:sticky; top:0; z-index:50;
      background:var(--panel); border-bottom:1px solid var(--line);
      padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
      box-shadow:0 1px 3px rgba(16,24,40,.06); }
    header h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:.2px; }

    /* --- wskaźniki pracy ------------------------------------------------------
       Jedno źródło prawdy w App (`pending`), żeby KAŻDE oczekiwanie było widoczne.
       Wcześniej „Popraw wg uwag” i „Poproś o podpowiedzi” — najdłuższe, bo czekają
       na model — dawały tylko szary tekst, który łatwo przeoczyć. */
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner { display:inline-block; flex:none; width:14px; height:14px; border-radius:50%;
      border:2px solid var(--accent-bg); border-top-color:var(--accent);
      animation:spin .7s linear infinite; }
    .spinner.big { width:20px; height:20px; border-width:3px; }
    .busy-chip { display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;
      color:var(--accent); background:var(--accent-bg); border:1px solid #dcd9fb;
      padding:6px 13px; border-radius:999px; }
    /* pasek na samej krawędzi ekranu — widoczny nawet gdy chip jest poza kadrem */
    @keyframes slide { from { left:-40%; } to { left:100%; } }
    .topbar { position:fixed; top:0; left:0; right:0; height:3px; z-index:60;
      background:var(--accent-bg); overflow:hidden; }
    .topbar i { position:absolute; top:0; height:3px; width:40%; background:var(--accent);
      animation:slide 1.1s ease-in-out infinite; }
    .busy-inline { display:flex; align-items:center; gap:10px; color:var(--accent);
      font-weight:600; padding:10px 0; }
    .busy-inline .sub { color:var(--muted); font-weight:400; }
    @media (prefers-reduced-motion:reduce) {
      .spinner, .topbar i { animation:none; }
      .topbar i { left:0; width:100%; opacity:.6; }
    }
    .wrap { max-width:1000px; margin:20px auto; padding:0 16px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
      padding:16px 18px; margin-bottom:16px; }
    .meta { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; align-items:center; }
    .meta .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px;
      border-radius:999px; vertical-align:middle; }
    .badge.new { color:var(--new); background:var(--new-bg); }
    .badge.existing { color:var(--exist); background:var(--exist-bg); }
    .node { border-radius:8px; }
    .site { border:1px solid var(--line); border-radius:10px; margin-bottom:14px; overflow:hidden; }
    .site > .row { background:#fafbfc; padding:10px 14px; font-weight:700; }
    .placement { margin:8px 10px 12px 10px; border:1px dashed var(--line); border-radius:8px; }
    .placement > .row { padding:8px 12px; background:#fcfcfd; font-weight:600; border-bottom:1px solid var(--line); }
    .ad-block { border-bottom:1px solid #f1f2f4; }
    .ad-block:last-child { border-bottom:none; }
    .ad { display:flex; align-items:center; gap:10px; padding:7px 12px 4px 14px; cursor:grab; }
    .ad.over { box-shadow: inset 0 2px 0 var(--accent); }
    .cre-list { padding: 0 12px 6px 44px; }
    .cre-wrap { padding: 3px 0; border-top: 1px dashed #f1f2f4; }
    .cre-wrap:first-child { border-top: none; }
    .cre-row { display:flex; align-items:center; gap:10px; }
    .cre-lp { padding-left: 28px; font-size: 12.5px; }
    .cre-lp input { font:inherit; padding:3px 7px; border:1px solid var(--line); border-radius:6px; }
    .grip { color:#c3c8d0; font-size:15px; }
    .arrow { color:var(--muted); }
    .icon { width:18px; text-align:center; }
    .name { font-weight:600; }
    .cre { color:#374151; }
    .spacer { flex:1; }
    .btn { border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 11px;
      font-size:13px; cursor:pointer; color:var(--ink); }
    .btn:hover { background:#f7f8fa; }
    .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    .btn.primary:hover { filter:brightness(1.05); }
    .btn.mini { padding:2px 7px; font-size:12px; }
    .btn.link { border:none; background:none; color:var(--accent); padding:2px 6px; }
    .btn.del { color:var(--danger); }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .edit { font:inherit; border:1px solid var(--accent); border-radius:5px; padding:1px 6px; }
    .editable:hover { background:#fffbe6; border-radius:4px; outline:1px dashed #e3d38a; cursor:text; }
    .hint { color:var(--muted); font-size:12px; }
    .tagbar { font-weight:700; }
    pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; overflow:auto;
      font-size:12px; max-height:340px; }
    select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
    .lines-title { font-weight:700; margin-bottom:10px; }
    .curbox { border:1px solid var(--accent); background:var(--accent-bg); border-radius:8px;
      padding:10px 12px; margin-bottom:14px; }
    .curbox .lead { font-weight:700; color:var(--accent); margin-bottom:4px; }
    .line-grp { border:1px solid var(--line); border-radius:8px; margin-bottom:8px; overflow:hidden; }
    .line-grp.used { border-color:var(--accent); }
    .line-hdr { padding:6px 12px; background:#fafbfc; font-weight:700; display:flex; gap:8px; align-items:center; }
    .line-grp.used .line-hdr { background:var(--accent-bg); }
    .variant { padding:6px 12px; border-top:1px solid #f1f2f4; display:flex; gap:10px; align-items:baseline; }
    .variant .vname { font-weight:600; min-width:110px; }
    .url { color:#2563eb; font-size:12.5px; word-break:break-all; text-decoration:none; }
    .url:hover { text-decoration:underline; }
    .tag-use { font-size:11px; font-weight:700; color:var(--accent); background:#fff; border:1px solid var(--accent);
      border-radius:999px; padding:1px 8px; }
    .qcard { border:1px solid #f0c36d; background:#fffaf0; border-radius:10px; padding:14px 16px; margin-bottom:16px; }
    .qcard .lead { font-weight:800; color:#a15c00; margin-bottom:10px; }
    .q { padding:8px 0; border-top:1px dashed #f0d9a8; }
    .q:first-of-type { border-top:none; }
    .q-prompt { font-weight:600; margin-bottom:6px; }
    .q-opt { display:flex; gap:8px; align-items:flex-start; padding:3px 0; cursor:pointer; }
    .q-note { color:#8a6d3b; font-size:12px; margin-top:4px; }
    .q-detail { font-size:12px; margin-top:6px; }
    .q-detail .u { color:#2563eb; word-break:break-all; }
    .form { display:grid; gap:10px; max-width:720px; }
    .form label { display:grid; gap:4px; font-size:12px; color:var(--muted); font-weight:600; }
    .form input[type=text], .form input:not([type]), .form textarea, .form select {
      font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:7px; color:var(--ink); }
    .form textarea { resize:vertical; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function EditableText({ value, onChange, className }) {
      const [editing, setEditing] = useState(false);
      const [v, setV] = useState(value);
      React.useEffect(() => setV(value), [value]);
      if (editing) {
        return <input className="edit" autoFocus value={v}
          onChange={e => setV(e.target.value)}
          onBlur={() => { setEditing(false); onChange(v); }}
          onKeyDown={e => { if (e.key === 'Enter') { setEditing(false); onChange(v); }
                            if (e.key === 'Escape') { setEditing(false); setV(value); } }} />;
      }
      return <span className={"editable " + (className || "")}
        title="Kliknij, aby edytować" onClick={() => setEditing(true)}>{value}</span>;
    }

    const Badge = ({ s }) => <span className={"badge " + s}>{s === 'new' ? 'nowe' : 'istnieje'}</span>;

    function QuestionsPanel({ questions, answers, onAnswer, onApply, pending, busy }) {
      if (!questions.length) return null;
      const toggle = (id, val) => {
        const cur = answers[id] || [];
        onAnswer(id, cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val]);
      };
      // Questions marked `rebuild` cannot be applied in the browser — the server has to
      // redistribute the zip across landing pages. Answer them all first and rebuild
      // ONCE: a zip split by format can raise half a dozen of these, and rebuilding per
      // click made the panel unusable.
      const toApply = questions.filter(q => q.rebuild);
      return (
        <div className="qcard">
          <div className="lead">❓ Do rozstrzygnięcia ({questions.length}) — odpowiedzi sterują drzewem poniżej</div>
          {questions.map(q => (
            <div className="q" key={q.id}>
              <div className="q-prompt">{q.prompt}</div>
              {q.options.map(o => (
                <label className="q-opt" key={o.value}>
                  <input
                    type={q.type === 'multi_choice' ? 'checkbox' : 'radio'}
                    name={q.id}
                    checked={q.type === 'multi_choice' ? (answers[q.id] || []).includes(o.value) : answers[q.id] === o.value}
                    onChange={() => q.type === 'multi_choice' ? toggle(q.id, o.value) : onAnswer(q.id, o.value)} />
                  <span>{o.label}</span>
                </label>
              ))}
              {q.note && <div className="q-note">ℹ️ {q.note}</div>}
              {q.detail && (
                <div className="q-detail">
                  {q.detail.existingLpName && <div>istnieje <b>{q.detail.existingLpName}</b>: <span className="u">{q.detail.existing}</span></div>}
                  {q.detail.new && <div>nowy: <span className="u">{q.detail.new}</span></div>}
                </div>
              )}
            </div>
          ))}
          {toApply.length > 0 && (
            <div style={{ marginTop: 10, display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
              {/* Wyłączony na czas KAŻDEJ operacji (żeby nie puścić dwóch naraz), ale bez
                  zmiany napisu: „Przebudowuję…” byłoby kłamstwem, gdy trwa np. wywołanie
                  agenta. Co się dzieje, mówi wskaźnik w nagłówku. */}
              <button className="btn primary" disabled={busy} onClick={onApply}>
                Zatwierdź przypisania ({toApply.length}) →</button>
              <span className="hint">
                {pending
                  ? '⚠️ Zmiany nie są jeszcze w drzewie poniżej — kliknij, żeby je zastosować.'
                  : 'Drzewo poniżej pokazuje domyślne przypisania. Zatwierdzenie przebuduje je raz, dla wszystkich odpowiedzi naraz.'}
              </span>
            </div>
          )}
        </div>
      );
    }

    function LinesPanel({ lines, source, existing, folders }) {
      // an order can carry SEVERAL landing pages; they may share a line number (same
      // page, different utm) or be separate lines
      const curNos = [...new Set(lines.map(l => l.number))];
      const usedNos = [...new Set(lines.filter(l => l.reusedLine).map(l => l.number))];
      const folderOf = idx => Object.keys((folders && folders.map) || {})
        .filter(f => folders.map[f] === idx);
      return (
        <div className="card">
          <div className="lines-title">🔗 Linie w kampanii</div>

          <div className="curbox">
            <div className="lead">
              {lines.length > 1
                ? `🔗 ${lines.length} strony docelowe w tym zleceniu `
                  + `(${curNos.length === 1 ? 'linia ' + curNos[0] : 'linie ' + curNos.join(', ')})`
                : (lines[0].reusedLine
                  ? `✅ Używamy istniejącej linii ${curNos[0]}`
                  : `➕ Dodajemy nową linię ${curNos[0]}`)}
            </div>
            {lines.map((line, i) => {
              const fs = folderOf(i);
              return (
                <div key={i} style={{ marginTop: i ? 8 : 0 }}>
                  <div>Creative: <b>{line.creativeName}</b> · Landing page: <b>{line.lpName}</b>
                    <span className="hint"> · linia {line.number} · źródło {source}
                      {lines.length === 1 ? ' · ścieżka ' + line.path : ''}</span></div>
                  {line.url && <div><a className="url" href={line.url} target="_blank">{line.url}</a></div>}
                  {lines.length > 1 && <div className="hint">
                    {fs.length ? `materiały z folderu: ${fs.join(', ')}` : 'materiały: wszystkie z paczki'}
                  </div>}
                </div>
              );
            })}
          </div>

          <div className="hint" style={{ marginBottom: 6 }}>
            Istniejące linie ({existing.length}){existing.length ? ' — pełne adresy:' : ' — brak (kampania bez linii)'}
          </div>

          {existing.map(l => {
            const used = usedNos.includes(l.number);
            return (
              <div className={"line-grp" + (used ? " used" : "")} key={l.number}>
                <div className="line-hdr">
                  linia{l.number}
                  {used && <span className="tag-use">← używamy tej linii</span>}
                </div>
                {l.variants.map((v, i) => (
                  <div className="variant" key={i}>
                    <span className="vname">{v.lpName}</span>
                    <a className="url" href={v.url} target="_blank">{v.url}</a>
                  </div>
                ))}
              </div>
            );
          })}

          {curNos.filter(n => !existing.some(l => l.number === n)).map(n => (
            <div className="line-grp used" key={n}>
              <div className="line-hdr">linia{n} <span className="tag-use">← dodajemy (nowa)</span></div>
              {lines.filter(l => l.number === n).map((l, i) => (
                <div className="variant" key={i}>
                  <span className="vname">{l.lpName}</span>
                  <a className="url" href={l.url} target="_blank">{l.url || '(adres z bieżącego linku)'}</a>
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    function CampaignBrowser({ onPick, currentId }) {
      const [campaigns, setCampaigns] = useState(null);
      const [openId, setOpenId] = useState(null);
      const [lpsById, setLpsById] = useState({});
      const [lpBusy, setLpBusy] = useState(null);

      useEffect(() => {
        fetch('/api/campaigns').then(r => r.json())
          .then(d => setCampaigns(d.campaigns || []))
          .catch(() => setCampaigns([]));
      }, []);

      const toggle = async (c) => {
        if (openId === c.id) { setOpenId(null); return; }
        setOpenId(c.id);
        if (!lpsById[c.id]) {
          setLpBusy(c.id);
          try {
            const r = await fetch('/api/campaign-lps?campaignId=' + encodeURIComponent(c.id));
            const d = await r.json();
            setLpsById(s => ({ ...s, [c.id]: d.landingPages || [] }));
          } catch (e) { setLpsById(s => ({ ...s, [c.id]: [] })); }
          setLpBusy(null);
        }
      };

      if (campaigns === null) return <div className="hint">Ładowanie listy kampanii…</div>;
      return (
        <div style={{ marginTop: 8 }}>
          <div className="hint" style={{ marginBottom: 6 }}>
            Kampanie tego advertisera ({campaigns.length}) — kliknij nazwę, aby zobaczyć strony docelowe:
          </div>
          {campaigns.map(c => (
            <div key={c.id} style={{ border: '1px solid var(--line)', borderRadius: 8, marginBottom: 6, overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px', cursor: 'pointer', background: '#fafbfc' }}
                onClick={() => toggle(c)}>
                <span>{openId === c.id ? '▾' : '▸'}</span>
                <b>{c.name}</b> <span className="hint">id={c.id}</span>
                {c.id === currentId && <span className="hint"> · bieżąca</span>}
                <div style={{ flex: 1 }} />
                <button className="btn mini" disabled={c.id === currentId}
                  onClick={e => { e.stopPropagation(); onPick(c.id); }}>
                  {c.id === currentId ? 'Używana' : 'Użyj tej kampanii'}</button>
              </div>
              {openId === c.id && (
                <div style={{ padding: '6px 10px' }}>
                  {lpBusy === c.id && <div className="hint">Ładowanie stron docelowych…</div>}
                  {lpsById[c.id] && lpsById[c.id].length === 0 && <div className="hint">Brak stron docelowych w tej kampanii.</div>}
                  {(lpsById[c.id] || []).map((lp, i) => (
                    <div key={i} style={{ padding: '2px 0' }}>
                      <span style={{ fontWeight: 600 }}>{lp.name}</span>{' '}
                      <a className="url" href={lp.url} target="_blank" rel="noreferrer">{lp.url}</a>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    // Choose the campaign to build on: an existing one, or a brand-new one by name.
    // Used both when nothing matched the link and when swapping the matched campaign.
    function CampaignPicker({ pathHint, currentId, busy, onPickExisting, onCreateNew }) {
      const [name, setName] = useState(pathHint || '');
      return (
        <div>
          <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
            <input type="text" value={name} onChange={e => setName(e.target.value)}
              placeholder="nazwa nowej kampanii" style={{ flex: 1 }} />
            <button className="btn primary" disabled={busy || !name.trim()}
              onClick={() => onCreateNew(name.trim())}>➕ Nowa kampania</button>
          </div>
          <div className="hint" style={{ marginTop: 6 }}>
            Kampania powstanie dopiero przy „Wykonaj w CM360” — wcześniej zobaczysz dry-run.
            Ustawienia domyślne: start dziś, koniec +5 lat, brak treści politycznych;
            LP tego linku staje się domyślną stroną docelową kampanii.
          </div>
          <CampaignBrowser onPick={onPickExisting} currentId={currentId} />
        </div>
      );
    }

    function InputPanel({ onResult, rebuildRef, onCanRebuild, onBusy }) {
      // one address per line: several LPs can belong to one order (all in the same
      // campaign), e.g. the same creatives tagged for prospecting and remarketing
      const [linkText, setLinkText] = useState('');
      const links = linkText.split('\n').map(s => s.trim()).filter(Boolean);
      const [source, setSource] = useState('GDN');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [busy, setBusy] = useState(false);
      const [note, setNote] = useState('');
      const [showSites, setShowSites] = useState(false);
      const [siteQ, setSiteQ] = useState('');
      const [siteRes, setSiteRes] = useState(null);
      const [siteNote, setSiteNote] = useState('');
      const [newSite, setNewSite] = useState(null);   // {name, url, dsId, dsName, allowNew, plan}
      const searchSites = async () => {
        setSiteNote('Szukam…'); setSiteRes(null);
        try {
          const r = await fetch('/api/sites?q=' + encodeURIComponent(siteQ));
          setSiteRes(await r.json()); setSiteNote('');
        } catch (e) { setSiteNote('Błąd: ' + e); }
      };
      // Site creation is two-step on purpose: plan (dry-run, also resolves the Site
      // Directory entry) and only then the real insert.
      const callCreateSite = async (dryRun) => {
        const s = newSite;
        setSiteNote(dryRun ? 'Planuję…' : 'Zapisuję w CM360…');
        try {
          const r = await fetch('/api/create-site', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: s.name, url: s.url, directorySiteId: s.dsId || null,
                                   allowNewDirectorySite: !!s.allowNew, dryRun }),
          });
          const d = await r.json();
          if (d.error) { setSiteNote('Błąd: ' + d.error); return; }
          if (dryRun) {
            setNewSite(x => ({ ...x, plan: d }));
            setSiteNote('');
          } else {
            setNewSite(null);
            setSiteNote(`Dodano Site „${d.name}" (id=${d.siteId})`
              + (d.createdDirectorySite ? ' + nowy wpis w Site Directory' : ' na istniejącym wpisie katalogu'));
            searchSites();
          }
        } catch (e) { setSiteNote('Błąd: ' + e); }
      };
      const [suggestData, setSuggestData] = useState(null);
      const [noteErr, setNoteErr] = useState(false);
      const fail = msg => { setNoteErr(true); setNote(msg); };
      const runAnalyze = async (extra) => {
        // Nazwij BRAKUJĄCY element wprost — "podaj link i wybierz plik" nie mówi, którego
        // z dwóch brakuje, a szary hint obok przycisku łatwo przeoczyć.
        if (!links.length && !file) return fail('Nie podałeś adresu LP ani nie wybrałeś pliku .zip');
        if (!links.length) return fail('Nie podałeś adresu LP');
        if (!file) return fail('Nie wybrałeś pliku .zip');
        setBusy(true); setNote(''); setNoteErr(false); setSuggestData(null);
        // report upwards: a rebuild triggered from the campaign card or from the folder
        // answers must light up the same indicator as clicking "Analizuj" here
        if (onBusy) onBusy(extra ? 'Przebudowuję propozycję' : 'Buduję propozycję',
                           'parsuję zip, czytam kampanię i strony docelowe z CM360');
        try {
          const b64 = await new Promise((res, rej) => {
            const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej;
            r.readAsDataURL(file);
          });
          const resp = await fetch('/api/build-proposal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ links, source, message, zipB64: b64, zipName: file.name, ...(extra || {}) }),
          });
          const data = await resp.json();
          if (data.error) fail(data.error);
          else if (data.suggestNewCampaign) { setSuggestData(data); setNote(''); setNoteErr(false); }
          else { onResult(data); setNoteErr(false); setNote('Zbudowano propozycję ✓'); }
        } catch (e) { fail('Nie udało się połączyć z serve.py: ' + e); }
        setBusy(false);
        if (onBusy) onBusy(null);
      };
      const analyze = () => runAnalyze();
      // expose the analysis to the campaign card above, so swapping the campaign can
      // rebuild the structure with the SAME link/zip/source/message (no re-entry)
      useEffect(() => { if (rebuildRef) rebuildRef.current = runAnalyze; });
      useEffect(() => { if (onCanRebuild) onCanRebuild(!!(links.length && file)); }, [links.length, !!file]);
      return (
        <div className="card">
          <div className="lines-title">📝 Nowe zlecenie</div>

            <label>Adresy LP <span className="hint">— jeden na linię; wszystkie trafią do tej samej kampanii</span>
              <textarea rows={Math.min(6, Math.max(2, links.length + 1))} value={linkText}
                onChange={e => setLinkText(e.target.value)}
                placeholder={"https://www.mbank.pl/lp2/2026/c1/...?utm_medium=prospecting\n"
                  + "https://www.mbank.pl/lp2/2026/c1/...?utm_medium=remarketing"} /></label>
            {links.length > 1 && <div className="hint">
              {links.length} adresy — narzędzie samo spróbuje przypisać foldery z zipa do
              poszczególnych stron; materiały bez pasującego folderu trafią pod każdą z nich.
            </div>}
            <label>Źródło
              <select value={source} onChange={e => setSource(e.target.value)}>
                {['GDN', 'Meta', 'Facebook', 'DemGen', 'Programmatic', 'Mailing'].map(s => <option key={s}>{s}</option>)}
              </select></label>
            <div>
              <button className="btn mini" onClick={() => setShowSites(s => !s)}>
                {showSites ? '▾' : '▸'} Nie ma źródła na liście? Szukaj/dodaj site (jak w CM)</button>
              {showSites && (
                <div style={{ border: '1px solid var(--line)', borderRadius: 8, padding: 10, marginTop: 6 }}>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <input type="text" value={siteQ} onChange={e => setSiteQ(e.target.value)}
                      placeholder="szukaj po nazwie…" style={{ flex: 1 }} />
                    <button className="btn mini" onClick={searchSites}>Szukaj</button>
                  </div>
                  {siteNote && <div className="hint" style={{ marginTop: 6 }}>{siteNote}</div>}
                  {siteRes && (
                    <div style={{ marginTop: 8 }}>
                      <div className="hint">Na koncie ({siteRes.account.length}):</div>
                      {siteRes.account.map(s => <div key={s.id}>🟢 {s.name} <span className="hint">id={s.id}</span></div>)}
                      <div className="hint" style={{ marginTop: 6 }}>
                        Site Directory ({siteRes.directory.length}) — „użyj” podepnie Site pod
                        ten istniejący wpis katalogu (tak działa większość Site na tym koncie):</div>
                      {siteRes.directory.slice(0, 8).map(s => (
                        <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                          <span>📁 {s.name} <span className="hint">{s.url}</span></span>
                          <div style={{ flex: 1 }} />
                          <button className="btn mini" onClick={() => setNewSite({
                            name: siteQ || s.name, url: s.url || '', dsId: s.id, dsName: s.name,
                            allowNew: false, plan: null })}>użyj</button>
                        </div>
                      ))}
                      <div style={{ marginTop: 8 }}>
                        <button className="btn mini" onClick={() => setNewSite({
                          name: siteQ, url: 'https://', dsId: null, dsName: null,
                          allowNew: false, plan: null })}>➕ Dodaj Site do konta</button>
                      </div>
                    </div>
                  )}
                  {newSite && (
                    <div className="qcard" style={{ marginTop: 10 }}>
                      <div className="lead">➕ Nowy Site na koncie</div>
                      <label>Nazwa Site (tak zobaczysz go w drzewie CM)
                        <input type="text" value={newSite.name}
                          onChange={e => setNewSite(x => ({ ...x, name: e.target.value, plan: null }))} /></label>
                      {newSite.dsId
                        ? <div className="hint" style={{ marginTop: 6 }}>
                            Wpis katalogu: <b>{newSite.dsName}</b> <span className="hint">id={newSite.dsId}</span>{' '}
                            <button className="btn link mini"
                              onClick={() => setNewSite(x => ({ ...x, dsId: null, dsName: null, plan: null }))}>
                              odepnij</button>
                          </div>
                        : <label style={{ marginTop: 6 }}>URL (wymagany przez CM tylko formalnie — na koncie to atrapy)
                            <input type="text" value={newSite.url}
                              onChange={e => setNewSite(x => ({ ...x, url: e.target.value, plan: null }))} /></label>}
                      {newSite.plan && <div className="hint" style={{ marginTop: 8 }}>
                        Plan: {newSite.plan.resolution}
                        {newSite.plan.needsNewDirectorySite
                          ? ' → trzeba utworzyć NOWY wpis w Site Directory (globalny, nieusuwalny)'
                          : ` → sites.insert na wpisie id=${newSite.plan.directorySiteId}`}
                      </div>}
                      {newSite.plan && newSite.plan.needsNewDirectorySite && (
                        <label style={{ marginTop: 6, display: 'block' }}>
                          <input type="checkbox" checked={!!newSite.allowNew}
                            onChange={e => setNewSite(x => ({ ...x, allowNew: e.target.checked }))} />
                          {' '}Tak, utwórz też nowy wpis w Site Directory
                        </label>
                      )}
                      <div style={{ marginTop: 8, display: 'flex', gap: 6 }}>
                        <button className="btn mini" disabled={!newSite.name.trim()}
                          onClick={() => callCreateSite(true)}>Zaplanuj (dry-run)</button>
                        <button className="btn primary mini"
                          disabled={!newSite.plan || (newSite.plan.needsNewDirectorySite && !newSite.allowNew)}
                          onClick={() => callCreateSite(false)}>Zapisz w CM360 →</button>
                        <button className="btn mini" onClick={() => setNewSite(null)}>Anuluj</button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
            <label>Materiały (.zip)
              <input type="file" accept=".zip" onChange={e => setFile(e.target.files[0])} /></label>
            <label>Wiadomość zlecenia (opcjonalnie)
              <textarea rows="3" value={message} onChange={e => setMessage(e.target.value)}
                placeholder="np. prośba o kody GDN dla formatów z załącznika..." /></label>
            <div>
              <button className="btn primary" disabled={busy} onClick={analyze}
                style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                {busy && <span className="spinner" style={{ borderTopColor: '#fff',
                  borderColor: 'rgba(255,255,255,.35)', borderTopStyle: 'solid' }} />}
                {busy ? 'Analizuję…' : 'Analizuj → zbuduj propozycję'}</button>
              {note && (noteErr
                ? <span style={{ marginLeft: 10, padding: '3px 8px', borderRadius: 6,
                                 background: '#fdecea', color: '#8a1c12',
                                 border: '1px solid #f5c6c0', fontWeight: 600 }}>⚠️ {note}</span>
                : <span className="hint" style={{ marginLeft: 10 }}>{note}</span>)}
            </div>
            {suggestData && (
              <div className="qcard">
                <div className="lead">🆕 Brak kampanii z pasującą ścieżką dla „{suggestData.advertiser}”</div>
                <div className="hint" style={{ marginBottom: 8 }}>
                  Możesz ręcznie przejrzeć istniejące kampanie i ich strony docelowe poniżej —
                  jeśli któraś jednak pasuje, kliknij „Użyj tej kampanii”. W przeciwnym razie
                  nazwij nową kampanię i zbuduj propozycję na niej.
                </div>
                <CampaignPicker pathHint={suggestData.pathHint} busy={busy}
                  onPickExisting={cid => runAnalyze({ campaignId: cid })}
                  onCreateNew={name => runAnalyze({ newCampaign: name })} />
              </div>
            )}

        </div>
      );
    }

    function CreativeRow({ cr, lineLp, orderLps, onRename, onDelete, onSetLP, onClearLP, onApplyToAll }) {

      const effUrl = cr.lpName ? (cr.lpUrl || '') : (lineLp.url || '');
      // with several LPs in the order every creative carries an explicit lpName, so
      // "own LP" must mean "hand-typed", not "one of the order's pages"
      const ofOrder = !cr.lpName || (orderLps || []).some(l => l.lpName === cr.lpName);

            <div className="spacer" />
            <button className="btn mini del" onClick={onDelete}>×</button>
          </div>
          <div className="cre-lp">

                LP: <b>{effName}</b> {ofOrder ? '(linia)' : '(własny)'}
                {' · '}<button className="btn link mini" onClick={startEdit}>
                  {cr.lpName ? 'edytuj' : 'ustaw własny LP'}</button>
                {cr.lpName && <button className="btn link mini" onClick={onClearLP}>usuń własny (użyj LP linii)</button>}
              </span>

                <button className="btn mini" onClick={() => setEditing(false)}>Anuluj</button>

    function App() {
      const [p, setP] = useState(null);
      const [origLine, setOrigLine] = useState(null);  // pristine {number,creativeName,lpName}, for line_conflict toggling
      const [showJson, setShowJson] = useState(false);
      const drag = useRef(null);
      const [over, setOver] = useState(null);

      const clone = () => JSON.parse(JSON.stringify(p));

      // Czy dry-run jest AKTUALNY dla struktury, którą widać na ekranie.
      // To zabezpieczenie, nie wygoda: bez tego można było kliknąć „Wykonaj w CM360”
      // na planie policzonym dla INNEJ struktury — obejrzeć jeden plan, a zapisać coś
      // innego. Dlatego każda zmiana drzewa unieważnia plan i wymusza ponowny dry-run.
      const [planFresh, setPlanFresh] = useState(false);
      // Wszystkie edycje struktury przechodzą przez `commit`, więc to jedyne miejsce,
      // w którym trzeba unieważnić plan. Nowa operacja edycyjna dostaje to darmo.
      const commit = np => { setP(np); setPlanFresh(false); };

      // JEDNO źródło prawdy o tym, że coś trwa. Każda operacja sieciowa przechodzi przez
      // `runBusy` albo raportuje przez `onBusy`, więc nie da się dodać nowej i zapomnieć
      // o wskaźniku. `what` mówi na co czekamy — sam spinner nie informuje o niczym.
      const [pending, setPending] = useState(null);   // {what, detail} | null
      const setBusyLabel = (what, detail) => setPending(what ? { what, detail } : null);
      async function runBusy(what, detail, fn) {
        setBusyLabel(what, detail);
        try { return await fn(); } finally { setBusyLabel(null); }
      }
      const rebuildRef = useRef(null);          // InputPanel's runAnalyze (same link/zip)
      const [canRebuild, setCanRebuild] = useState(false);
      const [changeCamp, setChangeCamp] = useState(false);
      // returns InputPanel's runAnalyze promise so callers can show their own progress
      const rebuildOn = extra => { setChangeCamp(false); setCommitRes(null); return rebuildRef.current(extra); };
      const [siteStruct, setSiteStruct] = useState(null);  // existing {placements:[{name,ads:[{name,creatives}]}]}
      function loadProposal(np) {
        setP(np);
        setAnswers(defaultsFor(np));
        setOrigLine(np && np.line ? { ...np.line } : null);
        setSiteStruct(null);
        setFoldersDirty(false);
        setPlanFresh(false);       // inna struktura = poprzedni plan nic nie znaczy
        if (np && np.campaign && np.campaign.id && np.site) {
          fetch(`/api/site-structure?campaignId=${encodeURIComponent(np.campaign.id)}&site=${encodeURIComponent(np.site.name)}`)
            .then(r => r.json()).then(setSiteStruct).catch(() => {});
        }
      }

      // ---- question answers drive the tree ----
      const defaultsFor = prop => { const a = {}; ((prop && prop.questions) || []).forEach(q => { a[q.id] = q.default; }); return a; };
      const [answers, setAnswers] = useState({});
      const [remarks, setRemarks] = useState('');
      const [aiNote, setAiNote] = useState('');
      const [aiResult, setAiResult] = useState(null);   // diff operacji od agenta (b)
      const [assistRes, setAssistRes] = useState(null); // podpowiedzi agenta (a)
      const [commitRes, setCommitRes] = useState(null);

      // Czy zapis ma być w ogóle POKAZANY. Zostaje widoczny (wyszarzony) także po zmianie
      // struktury — użytkownik ma widzieć, że przycisk był i dlaczego przestał działać,
      // a nie zgadywać, gdzie zniknął.
      const planSeen = planFresh || !!(commitRes && commitRes.dryRun && commitRes.log);

      const questions = (p && p.questions) || [];
      const groupsQ = questions.find(q => q.id === 'groups');
      const activeGroups = groupsQ ? (answers.groups || []) : null;
      const isVisible = pl => !pl.group || !activeGroups || activeGroups.includes(pl.group);

      // line_conflict is a REAL one-time rename (not a render override), so it plays
      // nicely with freely-edited/multiple creatives per ad added afterwards.
      // keep the chosen campaign when a rebuild is triggered for another reason
      const campaignExtra = () => (p && p.campaign
        ? (p.campaign.status === 'new' ? { newCampaign: p.campaign.name }
                                       : { campaignId: p.campaign.id })
        : {});

      // folder -> landing page answers waiting to be sent (see setAnswer)
      const [foldersDirty, setFoldersDirty] = useState(false);
      const applyFolderAnswers = () => {
        if (!canRebuild) return;
        const chosen = { ...((p && p.lpFolders && p.lpFolders.override) || {}) };
        Object.keys(answers).forEach(k => {
          if (k.startsWith('lp_folder:')) chosen[k.slice(10)] = answers[k];
        });
        setFoldersDirty(false);
        // no runBusy here: this goes through InputPanel's runAnalyze, which reports its
        // own label upwards — wrapping it too would just fight over the same state
        rebuildOn({ ...campaignExtra(), folderMap: chosen });
      };

      function setAnswer(id, val) {
        setAnswers(a => ({ ...a, [id]: val }));
        // Odpowiedzi trafiają do /api/commit i sterują tym, co faktycznie idzie do
        // zapisu (np. `groups` filtruje placementy przez isVisible), więc unieważniają
        // plan tak samo jak edycja drzewa. Świadomie unieważniam przy KAŻDEJ odpowiedzi:
        // najwyżej zrobisz dry-run, którego nie musiałeś — to tańsze niż zapis wykonany
        // na planie policzonym dla innych odpowiedzi.
        setPlanFresh(false);
        // Which folder feeds which landing page can only be applied by the server (it
        // redistributes the zip), so it is NOT rebuilt per click — the answer is just
        // recorded and `applyFolderAnswers` sends them all in one go.
        if (id.startsWith('lp_folder:')) { setFoldersDirty(true); return; }
        if (id !== 'line_conflict' || !p || !origLine) return;
        const lcQ2 = questions.find(q => q.id === 'line_conflict');
        const reuseLine = lcQ2 && lcQ2.detail && lcQ2.detail.reuseLine;
        if (!reuseLine) return;
        const fromName = val === 'reuse' ? origLine.creativeName : reuseLine.creativeName;
        const toName = val === 'reuse' ? reuseLine.creativeName : origLine.creativeName;
        // only relabel creatives that still match fromName — leaves manually
        // customized creative names (e.g. linia3-słońce) untouched.
        const np = clone();
        np.placements.forEach(pl => pl.ads.forEach(a => a.creatives.forEach(cr => {
          if (cr.name === fromName) { cr.name = toName; cr.status = val === 'reuse' ? 'existing' : 'new'; }
        })));
        np.line = val === 'reuse'
          ? { ...np.line, number: reuseLine.number, creativeName: reuseLine.creativeName,
              lpName: reuseLine.lpName, reusedLine: true }
          : { ...np.line, ...origLine, reusedLine: false };
        commit(np);
      }

      const tags = [];
      if (p) p.placements.forEach(pl => { if (isVisible(pl)) pl.ads.forEach(a =>
        a.creatives.forEach(cr => tags.push({ placement: pl.name, ad: a.name, creative: cr.name }))); });

      // ---- drag & drop of ads (within + across placements) ----
      function onDrop(toPl, toIdx) {
        const from = drag.current; drag.current = null; setOver(null);
        if (!from) return;
        const np = clone();
        const [moved] = np.placements[from.pl].ads.splice(from.idx, 1);
        let ti = toIdx;
        if (from.pl === toPl && from.idx < toIdx) ti -= 1;
        np.placements[toPl].ads.splice(ti, 0, moved);
        commit(np);
      }

      function renameAd(pl, idx, name) { const np = clone(); np.placements[pl].ads[idx].name = name; commit(np); }
      function renamePl(pl, name) { const np = clone(); np.placements[pl].name = name; commit(np); }
      function delAd(pl, idx) { const np = clone(); np.placements[pl].ads.splice(idx, 1); commit(np); }
      function addAd(pl, name, knownCreatives) {
        const np = clone();
        const already = (knownCreatives || []).includes(p.line.creativeName);
        np.placements[pl].ads.push({ name: name || "nowy", dimension: null, status: name ? 'existing' : 'new',
          creatives: [{ name: p.line.creativeName, type: "?", packaged: false, source_path: null,
                       status: already ? 'existing' : 'new' }] });
        commit(np);
      }
      function renameCre(pl, ai, ci, name) { const np = clone(); np.placements[pl].ads[ai].creatives[ci].name = name; commit(np); }
      function delCreative(pl, ai, ci) { const np = clone(); np.placements[pl].ads[ai].creatives.splice(ci, 1); commit(np); }
      function setCreativeLP(pl, ai, ci, lpName, lpUrl) {
        const np = clone(); const cr = np.placements[pl].ads[ai].creatives[ci];
        cr.lpName = lpName; cr.lpUrl = lpUrl; commit(np);
      }
      function clearCreativeLP(pl, ai, ci) {
        const np = clone(); const cr = np.placements[pl].ads[ai].creatives[ci];
        delete cr.lpName; delete cr.lpUrl; commit(np);
      }
      // "Zastosuj do wszystkich": if the row's name is unchanged since it appeared,
      // just add this creative to every ad missing it; if it was renamed (fromName
      // != toCr.name), rename the matching creative everywhere too (and still add it
      // where the old name never existed), so one click covers both add and rename.
      function applyCreativeToAll(srcPl, srcAi, fromName, toCr) {
        const np = clone();
        np.placements.forEach((pl, pi) => {
          if (!isVisible(pl)) return;
          pl.ads.forEach((a, ai) => {
            if (pi === srcPl && ai === srcAi) return;  // never touch siblings on the source ad itself
            const renamed = fromName !== toCr.name ? a.creatives.find(c => c.name === fromName) : null;
            if (renamed) {
              renamed.name = toCr.name; renamed.type = toCr.type; renamed.packaged = toCr.packaged;
              renamed.source_path = toCr.source_path;
              if (toCr.lpName) { renamed.lpName = toCr.lpName; renamed.lpUrl = toCr.lpUrl; }
              else { delete renamed.lpName; delete renamed.lpUrl; }
            } else if (!a.creatives.some(c => c.name === toCr.name)) {
              a.creatives.push({ name: toCr.name, type: toCr.type, packaged: toCr.packaged,
                source_path: toCr.source_path, status: 'new',
                ...(toCr.lpName ? { lpName: toCr.lpName, lpUrl: toCr.lpUrl } : {}) });
            }
          });
        });
        commit(np);
      }
      function addCreative(pl, ai) {
        const np = clone();
        np.placements[pl].ads[ai].creatives.push({ name: p.line.creativeName, type: "?",
          packaged: false, source_path: null, status: "new" });
        commit(np);
      }
      function addPlacement(name, isExisting) {
        const np = clone();
        np.placements.push({ name: name || "Nowy placement", group: null, source: p.source,
          site: p.site.name, compatibility: "DISPLAY", size: "1x1",
          status: isExisting ? 'existing' : 'new', ads: [] });
        commit(np);
      }
      function delPlacement(pl) { const np = clone(); np.placements.splice(pl, 1); commit(np); }

      // existing placements/ads from live CM (for pickers), minus what's already in this proposal
      function existingPlacementOptions() {
        if (!siteStruct) return [];
        const have = new Set(p.placements.map(pl => pl.name));
        return siteStruct.placements.filter(pl => !have.has(pl.name));
      }
      function existingAdOptions(plName) {
        if (!siteStruct) return [];
        const cur = p.placements.find(pl => pl.name === plName);
        const have = new Set((cur ? cur.ads : []).map(a => a.name));
        const src = siteStruct.placements.find(pl => pl.name === plName);
        return (src ? src.ads : []).filter(a => !have.has(a.name));
      }

      function loadFile(e) {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { try { loadProposal(JSON.parse(r.result)); } catch (err) { alert("Zły JSON: " + err); } };
        r.readAsText(f);
      }

      async function refine() {
        if (!remarks.trim()) { setAiNote('Wpisz uwagi, co poprawić.'); return; }
        setAiNote(''); setAiResult(null);
        // model po drugiej stronie n8n potrafi myśleć dziesiątki sekund — bez wyraźnego
        // wskaźnika użytkownik nie wie, czy kliknięcie w ogóle doszło
        await runBusy('Agent interpretuje uwagi',
                      'model zwraca listę operacji edycyjnych; może potrwać kilkadziesiąt sekund',
                      async () => {
          try {
            const resp = await fetch('/api/refine', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ proposal: p, answers, remarks }),
            });
            const d = await resp.json();
            if (d.error) { setAiNote('Błąd: ' + d.error); return; }
            setAiResult(d);
            if (d.proposal) loadProposal(d.proposal);
            setRemarks('');
            setAiNote(`Agent zastosował ${d.applied} zmian`
              + (d.skipped ? `, pominął ${d.skipped}` : '')
              + (d.unclear && d.unclear.length ? `, ma ${d.unclear.length} pytań` : '') + ' ✓');
          } catch (e) { setAiNote('Błąd (uruchom przez serve.py): ' + e); }
        });
      }

      async function assist() {
        setAiNote(''); setAssistRes(null);
        await runBusy('Agent analizuje strukturę',
                      'szukam podpowiedzi w punktach niskiej pewności',
                      async () => {
          try {
            const resp = await fetch('/api/assist', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ proposal: p }),
            });
            const d = await resp.json();
            if (d.error) { setAiNote('Błąd: ' + d.error); return; }
            setAssistRes(d.suggestions); setAiNote('Agent zwrócił podpowiedzi ✓');
          } catch (e) { setAiNote('Błąd (uruchom przez serve.py): ' + e); }
        });
      }

      // Accepting role (a)'s suggestions goes through the SAME apply_ops path as remarks
      // (the server translates them into ops), so there is one diff to review and no
      // second, untested way of changing the tree.
      async function applySuggestions() {
        setAiNote('');
        await runBusy('Stosuję sugestie agenta', 'tłumaczę je na operacje i nakładam na drzewo',
                      async () => {
          try {
            const resp = await fetch('/api/apply-suggestions', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ proposal: p, suggestions: assistRes }),
            });
            const d = await resp.json();
            if (d.error) { setAiNote('Błąd: ' + d.error); return; }
            setAiResult(d);
            if (d.proposal) loadProposal(d.proposal);
            setAiNote(`Zastosowano ${d.applied} zmian`
              + (d.skipped ? `, pominięto ${d.skipped}` : '') + ' ✓');
          } catch (e) { setAiNote('Błąd (uruchom przez serve.py): ' + e); }
        });
      }

      async function doCommit(dryRun) {
        setCommitRes({ busy: true, dryRun });
        await runBusy(dryRun ? 'Sprawdzam plan zapisu' : 'Zapisuję w CM360',
                      dryRun ? 'dry-run — czytam stan konta, nic nie zapisuję'
                             : 'tworzę LP, creative, placementy i ady, potem generuję tagi',
                      async () => {
          try {
            const eff = { ...p, placements: p.placements.filter(isVisible) };
            const r = await fetch('/api/commit', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ proposal: eff, answers, dryRun }),
            });
            const d = await r.json();
            setCommitRes(d);
            // Udany dry-run zatwierdza plan DLA TEJ struktury — dopiero to odblokowuje
            // realny zapis. Błąd nie zatwierdza niczego.
            if (dryRun) setPlanFresh(!!d.log && !d.error);
            // a campaign created just now must stop being "new", otherwise a second
            // commit would try to create it all over again
            if (!dryRun && d.campaignId && !p.campaign.id) {
              const np = clone();
              np.campaign.id = d.campaignId;
              np.campaign.status = 'existing';
              commit(np);          // to samo z siebie unieważnia plan
            }
            // Po realnym zapisie plan jest zużyty: struktura jest już w CM360, więc
            // powtórne kliknięcie „Wykonaj” zapisywałoby drugi raz. Wymuś nowy dry-run.
            if (!dryRun) setPlanFresh(false);
          } catch (e) { setCommitRes({ error: String(e) }); }
        });
      }

      return (
        <div>
          {/* pasek na samej krawędzi ekranu: widoczny niezależnie od pozycji skrola */}
          {pending && <div className="topbar"><i /></div>}

          <header>
            <h1>🧩 CM Worker — weryfikacja struktury</h1>
            {pending && (
              <div className="busy-chip" role="status" aria-live="polite">
                <span className="spinner" />
                <span>{pending.what}…</span>
              </div>
            )}
            <div className="spacer" />
            <div className="toolbar">
              <label className="btn">Wczytaj JSON
                <input type="file" accept="application/json" style={{ display: 'none' }} onChange={loadFile} /></label>
              <button className="btn" onClick={() => { loadProposal(null); setRemarks(''); setAiNote(''); }}>Wyczyść</button>
              <button className="btn" onClick={() => setShowJson(s => !s)}>{showJson ? 'Ukryj JSON' : 'Podgląd JSON'}</button>
              {/* Zatwierdzenie jest nieklikalne, dopóki plan jest aktualny — nie ma czego
                  sprawdzać drugi raz. Odblokowuje się samo, gdy zmienisz strukturę. */}
              <button className="btn primary" disabled={!p || !!pending || planFresh}
                title={planFresh ? 'Plan jest aktualny dla tej struktury — zmień coś, żeby sprawdzić ponownie'
                                 : 'Dry-run: pokaże plan zapisu, nic nie zapisze'}
                onClick={() => doCommit(true)}>Zatwierdź strukturę →</button>
              {/* Zapis pojawia się dopiero po dry-runie i tylko dla planu policzonego
                  dla struktury, którą widać teraz na ekranie. */}
              {planSeen && (
                <button className="btn primary" disabled={!planFresh || !!pending}
                  style={!planFresh || pending ? undefined
                    : { background: '#15803d', borderColor: '#15803d' }}
                  title={planFresh ? 'Zapisze strukturę w CM360 i wygeneruje tagi'
                                   : 'Struktura zmieniła się po ostatnim podglądzie — zatwierdź ją ponownie'}
                  onClick={() => doCommit(false)}>Wykonaj w CM360 (zapis) →</button>
              )}
            </div>
          </header>

          {/* na co dokładnie czekamy — spinner sam z siebie nie informuje o niczym */}
          {pending && pending.detail && (
            <div style={{ background: 'var(--accent-bg)', borderBottom: '1px solid #dcd9fb',
                          padding: '7px 20px', fontSize: 13, color: 'var(--accent)' }}>
              <b>{pending.what}</b> <span style={{ opacity: .8 }}>— {pending.detail}</span>
            </div>
          )}

          <div className="wrap">
            <InputPanel onResult={loadProposal} rebuildRef={rebuildRef} onCanRebuild={setCanRebuild}
              onBusy={setBusyLabel} />

            {!p && <div className="card"><span className="hint">Wprowadź adres LP i wgraj plik .zip w karcie „Nowe zlecenie", a następnie kliknij „Analizuj → zbuduj propozycję".</span></div>}

            {p && <React.Fragment>
            <div className="card">
              <div className="meta">
                <span className="k">Kampania</span>
                <span><EditableText value={p.campaign.name} onChange={v => { const np = clone(); np.campaign.name = v; commit(np); }} /> <Badge s={p.campaign.status} /> <span className="hint">id={p.campaign.id || '— (nowa)'}</span>
                  {canRebuild && <button className="btn link mini" style={{ marginLeft: 8 }}
                    onClick={() => setChangeCamp(s => !s)}>
                    {changeCamp ? '▾ ukryj' : '🔄 zmień kampanię'}</button>}</span>
                <span className="k">Źródło → Site</span>
                <span><b>{p.source}</b> <span className="arrow">→</span> {p.site.name} <Badge s={p.site.status} /></span>
              </div>
              {changeCamp && <div className="qcard" style={{ marginTop: 10 }}>
                <div className="hint" style={{ marginBottom: 8 }}>
                  Wybór innej kampanii (albo utworzenie nowej) <b>przebuduje strukturę od zera</b> dla
                  tej kampanii — z tego samego linku i zipa. Ręczne zmiany w drzewie przepadną.
                </div>
                <CampaignPicker pathHint={p.line && p.line.path} currentId={p.campaign.id}
                  onPickExisting={cid => rebuildOn({ campaignId: cid })}
                  onCreateNew={name => rebuildOn({ newCampaign: name })} />
              </div>}
            </div>

            <QuestionsPanel questions={p.questions || []} answers={answers} onAnswer={setAnswer}
              onApply={applyFolderAnswers} pending={foldersDirty} busy={!!pending} />
            <LinesPanel lines={p.lines || [p.line]} source={p.source}
              existing={p.existingLines || []} folders={p.lpFolders} />

            <div className="card">
              <div className="toolbar" style={{ marginBottom: 12 }}>
                <span className="tagbar">🏷️ Tagi do wygenerowania: {tags.length}</span>
                <span className="hint">= liczba (Ad × Creative). Przeciągnij Ad, aby przenieść. Kliknij nazwę, aby edytować.</span>
                <div className="spacer" />
                <AddPicker label="+ placement" options={existingPlacementOptions()}
                  optionLabel={o => `${o.name} (${o.ads.length} adów)`}
                  onPick={o => addPlacement(o.name, true)}
                  onAddNew={name => addPlacement(name, false)}
                  placeholder="nazwa nowego placementu" />
              </div>

              {p.ai && p.ai.escalations && p.ai.escalations.length > 0 && (
                <div className="qcard" style={{ marginBottom: 12 }}>
                  <div className="lead">🤖 Punkty niskiej pewności ({p.ai.escalations.length})</div>
                  <div className="hint" style={{ marginBottom: 6 }}>
                    Tu reguły deterministyczne nie wystarczyły. Agent może podpowiedzieć —
                    podpowiedzi <b>nie zmieniają drzewa</b>, decydujesz Ty.
                  </div>
                  {p.ai.escalations.map((e, i) => (
                    <div key={i} style={{ padding: '2px 0' }}>
                      <b>{e.code}</b> <span className="hint">· {e.reason}</span>
                    </div>
                  ))}
                  <div style={{ marginTop: 8 }}>
                    <button className="btn" disabled={!(p.ai.wired || {}).structure || !!pending}
                      onClick={assist}>🤖 Poproś Agenta o podpowiedzi</button>
                    {!(p.ai.wired || {}).structure &&
                      <span className="hint" style={{ marginLeft: 10 }}>
                        nie podpięte — ustaw <code>N8N_STRUCTURE_URL</code></span>}
                  </div>
                </div>
              )}

              {assistRes && (
                <div className="qcard" style={{ marginBottom: 12 }}>
                  <div className="lead">🤖 Podpowiedzi Agenta (nic jeszcze nie zmieniono)</div>
                  <div className="hint">pewność: {assistRes.confidence}</div>
                  {(assistRes.group_mappings || []).map((g, i) => (
                    <div key={i} style={{ padding: '2px 0' }}>
                      📁 <b>{g.folder}</b> <span className="arrow">→</span> {g.source} / {g.site} / placement <b>{g.placement}</b>
                      <span className="hint"> · adKey {g.adKey} · {g.confidence} · {g.reason}</span>
                    </div>
                  ))}
                  {(assistRes.lines || []).map((l, i) => (
                    <div key={i} style={{ padding: '2px 0' }}>
                      🔗 <b>{l.creativeName}</b> <span className="hint">({l.lpName}
                      {l.audience ? ', ' + l.audience : ''}) → {l.lpUrl}</span>
                    </div>
                  ))}
                  {(assistRes.ad_naming || []).map((a, i) => (
                    <div key={i} style={{ padding: '2px 0' }}>
                      📐 {a.unit} <span className="arrow">→</span> <b>{a.adName}</b>
                      <span className="hint"> · {a.reason}</span>
                    </div>
                  ))}
                  {assistRes.notes && <div className="hint" style={{ marginTop: 6 }}>{assistRes.notes}</div>}
                  <div style={{ marginTop: 8, display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                    <button className="btn primary" disabled={!!pending}
                      onClick={applySuggestions}>✓ Zastosuj sugestie</button>
                    <button className="btn mini" onClick={() => setAssistRes(null)}>Zamknij</button>
                    <span className="hint">
                      Zastosuje nazwy linii i landing page. Nazwy adów i mapowania folderów
                      zostaną pominięte — powie o tym raport poniżej.
                    </span>
                  </div>
                </div>
              )}

              <div className="form" style={{ maxWidth: 'none', marginBottom: 14 }}>
                <textarea rows="2" value={remarks} onChange={e => setRemarks(e.target.value)}
                  placeholder="Coś się nie zgadza w strukturze? Napisz co poprawić — Agent AI zinterpretuje uwagi i przygotuje poprawioną strukturę (np. 'Screening to osobny placement', '300x250 ma iść pod linia4')." />
                <div>
                  <button className="btn" disabled={!((p.ai || {}).wired || {}).intent || !!pending}
                    onClick={refine}>✨ Popraw strukturę wg uwag (AI)</button>
                  {!((p.ai || {}).wired || {}).intent &&
                    <span className="hint" style={{ marginLeft: 10 }}>
                      nie podpięte — ustaw <code>N8N_INTENT_URL</code></span>}
                  {aiNote && <span className="hint" style={{ marginLeft: 10 }}>{aiNote}</span>}
                </div>
              </div>

              {aiResult && (
                <div className="qcard" style={{ marginBottom: 14 }}>
                  <div className="lead">✨ Co Agent zmienił ({aiResult.applied} z {(aiResult.log || []).length})</div>
                  {(aiResult.log || []).map((e, i) => (
                    <div key={i} style={{ padding: '2px 0' }}>
                      {e.ok ? '✓' : '–'} <b>{e.op}</b> <span className="hint">· {e.detail}</span>
                    </div>
                  ))}
                  {(aiResult.unclear || []).length > 0 && <div style={{ marginTop: 8 }}>
                    <div className="hint">Agent nie był pewien i pyta — nie zgadywał:</div>
                    {aiResult.unclear.map((q, i) => <div key={i}>❓ {q}</div>)}
                  </div>}
                  {/* role (b) sends one string, apply-suggestions sends a list of what
                      it deliberately did not translate — render both readably */}
                  {Array.isArray(aiResult.notes)
                    ? aiResult.notes.map((n, i) => (
                        <div className="hint" key={i} style={{ marginTop: 4 }}>ℹ️ {n}</div>))
                    : aiResult.notes && <div className="hint" style={{ marginTop: 6 }}>{aiResult.notes}</div>}
                  <div style={{ marginTop: 8 }}>
                    <button className="btn mini" onClick={() => setAiResult(null)}>Zamknij</button>
                  </div>
                </div>
              )}

              <div className="node">
                <div className="site">
                  <div className="row">🌐 {p.site.name} <Badge s={p.site.status} /></div>
                  {p.placements.map((pl, pi) => isVisible(pl) && (
                    <div className="placement" key={pi}
                      onDragOver={e => { e.preventDefault(); }}
                      onDrop={() => onDrop(pi, pl.ads.length)}>
                      <div className="row">
                        📄 <EditableText value={pl.name} onChange={v => renamePl(pi, v)} /> <Badge s={pl.status} />
                        {pl.group && <span className="hint"> · grupa {pl.group}</span>}
                        <span className="hint"> · {pl.site} · {pl.size}</span>
                        <AddPicker label="+ ad" options={existingAdOptions(pl.name)}
                          optionLabel={o => `${o.name} (${o.creatives.length} creative: ${o.creatives.join(', ') || '—'})`}
                          onPick={o => addAd(pi, o.name, o.creatives)}
                          onAddNew={name => addAd(pi, name)}
                          placeholder="nazwa/wymiar nowego ad" />
                        <button className="btn link mini del" onClick={() => delPlacement(pi)}>usuń</button>
                      </div>
                      {pl.ads.map((a, ai) => (
                        <div className="ad-block" key={ai}>
                          <div
                            className={"ad" + (over && over.pl === pi && over.idx === ai ? " over" : "")}
                            draggable
                            onDragStart={() => { drag.current = { pl: pi, idx: ai }; }}
                            onDragOver={e => { e.preventDefault(); e.stopPropagation(); setOver({ pl: pi, idx: ai }); }}
                            onDragLeave={() => setOver(null)}
                            onDrop={e => { e.stopPropagation(); onDrop(pi, ai); }}>
                            <span className="grip">⋮⋮</span>
                            <span className="icon">📐</span>
                            <span className="name"><EditableText value={a.name} onChange={v => renameAd(pi, ai, v)} /></span>
                            <Badge s={a.status} />
                            <div className="spacer" />
                            <button className="btn link mini" onClick={() => addCreative(pi, ai)}>+ creative</button>
                            <button className="btn mini del" onClick={() => delAd(pi, ai)}>usuń ad</button>
                          </div>
                          <div className="cre-list">
                            {a.creatives.map((cr, ci) => (
                              <CreativeRow key={ci} cr={cr} lineLp={p.line} orderLps={p.lines || [p.line]}
                                onRename={v => renameCre(pi, ai, ci, v)}
                                onDelete={() => delCreative(pi, ai, ci)}
                                onSetLP={(n, u) => setCreativeLP(pi, ai, ci, n, u)}
                                onClearLP={() => clearCreativeLP(pi, ai, ci)}
                                onApplyToAll={(fromName, toCr) => applyCreativeToAll(pi, ai, fromName, toCr)} />
                            ))}
                            {a.creatives.length === 0 &&
                              <div className="hint">— brak creative — <button className="btn link mini" onClick={() => addCreative(pi, ai)}>+ dodaj</button></div>}
                          </div>
                        </div>
                      ))}
                      {pl.ads.length === 0 && <div className="ad hint" style={{ cursor: 'default' }}>— pusto — przeciągnij tu Ad —</div>}
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {p.warnings && p.warnings.length > 0 &&
              <div className="card"><b>⚠️ Uwagi parsera:</b> <span className="hint">{p.warnings.join(' · ')}</span></div>}

            {showJson && <div className="card"><pre>{JSON.stringify(p, null, 2)}</pre></div>}

            {commitRes && <div className="card">
              <div className="lines-title">{commitRes.dryRun ? '🔍 Podgląd zapisu (dry-run — nic nie zapisano)' : '✅ Zapis do CM360 wykonany'}</div>
              {commitRes.busy && <div className="busy-inline"><span className="spinner big" />
                <span>{commitRes.dryRun ? 'Sprawdzam plan zapisu' : 'Zapisuję w CM360'}…
                  <span className="sub"> to potrwa — czytam stan konta z API CM360</span></span></div>}
              {commitRes.error && <div className="hint">Błąd: {commitRes.error}</div>}
              {commitRes.log && commitRes.log.map((e, i) => (
                <div key={i} style={{ padding: '2px 0' }}>
                  <b>{e.action}</b> {e.kind} <b>{e.name}</b> {e.id ? <span className="hint">id={e.id}</span> : null}
                  {e.detail ? <span className="hint"> · {e.detail}</span> : null}
                </div>
              ))}
              {commitRes.tags && <div style={{ marginTop: 8 }}>🏷️ Tagi: <b>{commitRes.tags.count}</b> → <span className="hint">{commitRes.tags.file}</span></div>}
              {commitRes.dryRun && commitRes.log && !planFresh && !commitRes.busy && (
                <div style={{ marginTop: 10, padding: '8px 11px', borderRadius: 8,
                              background: '#fdecea', color: '#8a1c12',
                              border: '1px solid #f5c6c0', fontWeight: 600 }}>
                  ⚠️ Struktura zmieniła się po tym podglądzie — ten plan jest nieaktualny.
                  Kliknij „Zatwierdź strukturę”, żeby policzyć go od nowa.
                </div>
              )}
              {(commitRes.log || commitRes.error) && <div style={{ marginTop: 12 }}>
                {commitRes.dryRun && commitRes.log &&
                  <button className="btn primary" disabled={!planFresh || !!pending}
                    title={planFresh ? 'Zapisze strukturę w CM360 i wygeneruje tagi'
                                     : 'Plan jest nieaktualny — zatwierdź strukturę ponownie'}
                    onClick={() => doCommit(false)}>Wykonaj w CM360 (zapis) →</button>}
                <button className="btn" style={{ marginLeft: 8 }} onClick={() => setCommitRes(null)}>Zamknij</button>
              </div>}
            </div>}
            </React.Fragment>}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
